<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start — Simulação de Fluxo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 460px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.2rem;
      color: #38bdf8;
    }
    .status {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .track {
      width: 100%;
      height: 14px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #334155;
      margin-bottom: 18px;
    }
    .bar {
      width: 0%;
      height: 100%;
      background: #22c55e;
      transition: width 0.2s linear;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .note {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Fluxo Visual — Celular Desligado via USB</h1>
    <div id="status" class="status">Aguardando clique em Start...</div>
    <div class="track">
      <div id="bar" class="bar"></div>
    </div>
    <button id="startBtn" type="button">Start</button>
    <p class="note">Simulação visual apenas no navegador: não acessa porta USB nem formata ou liga aparelhos reais.</p>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const barEl = document.getElementById("bar");

    const DURATION_MS = 10000; // 10 segundos de simulação visual
    let timerId = null;

    startBtn.addEventListener("click", () => {
      if (timerId) return;
      startBtn.disabled = true;
      const startTime = Date.now();

      timerId = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const pct = Math.min(100, (elapsed / DURATION_MS) * 100);
        barEl.style.width = `${pct}%`;

        if (pct < 25) {
          statusEl.textContent = "Verificando cabo USB e aparelho desligado...";
        } else if (pct < 80) {
          statusEl.textContent = "Formatando dispositivo desligado...";
        } else if (pct < 100) {
          statusEl.textContent = "Formatação concluída. Ligando o celular...";
        } else {
          clearInterval(timerId);
          timerId = null;
          statusEl.textContent = "Processo visual concluído e aparelho ligado.";
          startBtn.disabled = false;
        }
      }, 100);
    });
  </script>
</body>
</html>
